<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — praxis</title>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f4ef;color:#111;font:400 16px/1.5 'Onest',system-ui,sans-serif;padding:24px}
main{max-width:46ch;text-align:left}
.cap{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#666;margin-bottom:14px}
h1{font-size:clamp(28px,4vw,40px);font-weight:500;letter-spacing:-.04em;line-height:1.05;margin:0 0 14px}
p{color:#555;margin:0 0 22px}
a.btn{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:14px 24px;font-size:15px;font-weight:500;text-decoration:none}
</style>
<script>
(function(){var m=location.pathname.match(/^\/cases\/([a-z0-9-]+)\.html$/);if(m){location.replace('/#case-'+m[1]);return;}if(location.pathname!=='/'&&location.pathname.indexOf('/cases/')===0){location.replace('/#cases');}})();
</script>
</head>
<body>
<main>
<div class="cap">praxis</div>
<h1>Такой страницы нет</h1>
<p>Возможно, ссылка устарела. Всё, что у нас есть, собрано на одной странице.</p>
<a class="btn" href="/">На главную →</a>
</main>
</body>
</html>
